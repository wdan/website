{{ define "extra-css" }}
<link rel="stylesheet" href="/css/program.css">
{{ end }}

{{ define "main" }}
<main class="program-page">
    <!-- Hero Section -->
    <section class="program-hero">
        <h1 class="program-title">{{ .Title | upper }}</h1>
        <p class="program-description">{{ .Params.description }}</p>
    </section>

    <!-- Marquee Banner -->
    <!-- Marquee Banner -->
    {{ partial "marquee.html" (dict "text" "LATEST SCREENING PROGRAMS") }}

    <!-- Programs Grid -->
    <section class="programs-section">
        {{ range .Params.programs }}
        {{ partial "program-card.html" (dict "program" .) }}
        {{ end }}
    </section>
</main>
{{ end }}
